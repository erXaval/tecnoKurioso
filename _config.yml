# =============================================================
#  TecnoKurioso · configuración del sitio
#  Tras cambiar este fichero, reinicia `bundle exec jekyll serve`.
# =============================================================

# --- Identidad del sitio ---
title: TecnoKurioso
tagline: "Telecomunicaciones, IA e innovación, contadas desde dentro"
description: >-
  Blog sobre noticias, innovación y nuevos usos de la inteligencia artificial
  en el mundo de las telecomunicaciones, explicado de forma clara.
author: Óscar Muñoz
lang: es
timezone: Europe/Madrid
github_username: erXaval

# --- Dónde vive el sitio (GitHub Pages, sitio de proyecto) ---
url: "https://erxaval.github.io"
baseurl: "/tecnoKurioso"

# --- Tema y plugins ---
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  date_format: "%d/%m/%Y"

# --- Entradas ---
permalink: /:categories/:title/
excerpt_separator: <!--more-->
show_excerpts: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Óscar Muñoz"

# --- Menú de la cabecera (orden de aparición) ---
header_pages:
  - noticias.md
  - ia-telecom.md
  - explicado.md
  - archivo.md
  - about.md

# --- Ficheros que no forman parte de la web ---
exclude:
  - README.md
  - LICENSE
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
