<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Niveles de red autónoma del TM Forum" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1200" height="640" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0b1f3a">Seis niveles hacia la red que se gestiona sola</text>
<text x="36" y="76" font-size="17" fill="#475569">Niveles de red autónoma definidos por el TM Forum</text>
<rect x="36" y="410" width="182" height="170" rx="10" fill="#e9ecef"/>
<text x="50" y="450" font-size="30" font-weight="800" fill="#0b1f3a">L0</text>
<text x="50" y="478" font-size="16" font-weight="700" fill="#0b1f3a">Operación manual</text>
<text x="50" y="506" font-size="14.5" fill="#0b1f3a">Todo lo hacen</text>
<text x="50" y="525" font-size="14.5" fill="#0b1f3a">personas</text>
<rect x="226" y="348" width="182" height="232" rx="10" fill="#d0ebff"/>
<text x="240" y="388" font-size="30" font-weight="800" fill="#0b1f3a">L1</text>
<text x="240" y="416" font-size="16" font-weight="700" fill="#0b1f3a">Asistida</text>
<text x="240" y="444" font-size="14.5" fill="#0b1f3a">El sistema ejecuta</text>
<text x="240" y="463" font-size="14.5" fill="#0b1f3a">tareas repetitivas</text>
<rect x="416" y="286" width="182" height="294" rx="10" fill="#a5d8ff"/>
<text x="430" y="326" font-size="30" font-weight="800" fill="#0b1f3a">L2</text>
<text x="430" y="354" font-size="16" font-weight="700" fill="#0b1f3a">Autonomía</text>
<text x="430" y="374" font-size="16" font-weight="700" fill="#0b1f3a">parcial</text>
<text x="430" y="402" font-size="14.5" fill="#0b1f3a">Bucles cerrados en</text>
<text x="430" y="421" font-size="14.5" fill="#0b1f3a">algunos casos</text>
<rect x="606" y="224" width="182" height="356" rx="10" fill="#74c0fc"/>
<text x="620" y="264" font-size="30" font-weight="800" fill="#0b1f3a">L3</text>
<text x="620" y="292" font-size="16" font-weight="700" fill="#0b1f3a">Autonomía</text>
<text x="620" y="312" font-size="16" font-weight="700" fill="#0b1f3a">condicional</text>
<text x="620" y="340" font-size="14.5" fill="#0b1f3a">El sistema analiza y</text>
<text x="620" y="359" font-size="14.5" fill="#0b1f3a">decide en su dominio</text>
<rect x="796" y="162" width="182" height="418" rx="10" fill="#4c6ef5"/>
<text x="810" y="202" font-size="30" font-weight="800" fill="#ffffff">L4</text>
<text x="810" y="230" font-size="16" font-weight="700" fill="#ffffff">Alta autonomía</text>
<text x="810" y="258" font-size="14.5" fill="#ffffff">Se adapta solo en</text>
<text x="810" y="277" font-size="14.5" fill="#ffffff">escenarios complejos</text>
<rect x="986" y="100" width="182" height="480" rx="10" fill="#5f3dc4"/>
<text x="1000" y="140" font-size="30" font-weight="800" fill="#ffffff">L5</text>
<text x="1000" y="168" font-size="16" font-weight="700" fill="#ffffff">Autonomía total</text>
<text x="1000" y="196" font-size="14.5" fill="#ffffff">Entiende la</text>
<text x="1000" y="215" font-size="14.5" fill="#ffffff">intención en</text>
<text x="1000" y="234" font-size="14.5" fill="#ffffff">cualquier escenario</text>
<line x1="36" y1="594" x2="1164" y2="594" stroke="#94a3b8" stroke-width="2"/>
<text x="36" y="622" font-size="15" fill="#475569">← Más intervención humana</text>
<text x="1164" y="622" font-size="15" fill="#475569" text-anchor="end">Más autonomía del sistema →</text>
</svg>