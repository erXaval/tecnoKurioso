<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Flujo de descarga de un perfil eSIM" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0b1f3a">Cómo llega un perfil eSIM a tu móvil</text>
  <text x="40" y="76" font-size="17" fill="#475569">Arquitectura de consumo de la GSMA (SGP.22), simplificada</text>

  <!-- Servidores -->
  <g>
    <rect x="40" y="110" width="240" height="96" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="160" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">Operador</text>
    <text x="160" y="180" text-anchor="middle" font-size="15" fill="#475569">da de alta tu línea</text>
  </g>
  <g>
    <rect x="480" y="110" width="240" height="96" rx="12" fill="#e6fcf5" stroke="#0c8599" stroke-width="2.5"/>
    <text x="600" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">SM-DP+</text>
    <text x="600" y="180" text-anchor="middle" font-size="15" fill="#475569">prepara y protege el perfil</text>
  </g>
  <g>
    <rect x="920" y="110" width="240" height="96" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1040" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">SM-DS</text>
    <text x="1040" y="180" text-anchor="middle" font-size="15" fill="#475569">descubrimiento (sin QR)</text>
  </g>

  <!-- Móvil -->
  <rect x="440" y="330" width="720" height="270" rx="22" fill="#f8fafc" stroke="#0b1f3a" stroke-width="2.5"/>
  <text x="470" y="368" font-size="18" font-weight="700" fill="#0b1f3a">Tu móvil</text>
  <g>
    <rect x="480" y="420" width="240" height="110" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="600" y="464" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">LPA</text>
    <text x="600" y="492" text-anchor="middle" font-size="15" fill="#475569">asistente de descarga</text>
  </g>
  <g>
    <rect x="890" y="420" width="240" height="110" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
    <text x="1010" y="464" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">Chip eUICC</text>
    <text x="1010" y="492" text-anchor="middle" font-size="15" fill="#475569">5 · instala el perfil</text>
  </g>

  <!-- Código QR -->
  <g>
    <rect x="40" y="420" width="240" height="110" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="160" y="464" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f3a">Código QR</text>
    <text x="160" y="492" text-anchor="middle" font-size="15" fill="#475569">dirección + Matching ID</text>
  </g>

  <!-- Flechas -->
  <g fill="none" stroke="#334155" stroke-width="2.2">
    <path d="M280 158H476" marker-end="url(#a)"/>
    <path d="M160 206V416" marker-end="url(#a)"/>
    <path d="M280 475H476" marker-end="url(#a)"/>
    <path d="M585 416V210" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M724 475H886" marker-end="url(#a)"/>
  </g>
  <path d="M720 158H916" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <path d="M660 210C660 300 1010 300 1010 416" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#o)"/>

  <!-- Etiquetas -->
  <g font-size="15" fill="#0b1f3a">
    <text x="378" y="146" text-anchor="middle" font-weight="600">1 · Encarga el perfil</text>
    <text x="378" y="184" text-anchor="middle" fill="#475569">ES2+</text>
    <text x="176" y="300" font-weight="600">2 · Te entrega</text>
    <text x="176" y="320" font-weight="600">el código</text>
    <text x="378" y="463" text-anchor="middle" fill="#475569">escaneas</text>
    <text x="574" y="268" text-anchor="end" font-weight="600">3 · Autenticación</text>
    <text x="574" y="288" text-anchor="end" font-weight="600">mutua · ES9+</text>
    <text x="818" y="146" text-anchor="middle" fill="#475569">registra evento</text>
    <text x="700" y="240" font-weight="600" fill="#c2410c">4 · Perfil cifrado de extremo a extremo · ES8+</text>
    <text x="805" y="463" text-anchor="middle" fill="#475569">ES10</text>
  </g>
</svg>
