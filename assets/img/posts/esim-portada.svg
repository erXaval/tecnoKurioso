    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd8a8"/><stop offset="1" stop-color="#f59f00"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".12" stroke="#ffffff" fill="none">
    <circle cx="600" cy="338" r="180"/><circle cx="600" cy="338" r="260"/><circle cx="600" cy="338" r="340"/><circle cx="600" cy="338" r="420"/>
  </g>
  <!-- móvil -->
