      <rect x="88" y="24" width="16" height="16"/><rect x="88" y="56" width="16" height="16"/><rect x="88" y="92" width="16" height="16"/>
      <rect x="24" y="92" width="16" height="16"/><rect x="56" y="92" width="16" height="16"/><rect x="124" y="92" width="16" height="16"/>
      <rect x="160" y="92" width="16" height="16"/><rect x="92" y="128" width="16" height="16"/><rect x="128" y="128" width="16" height="16"/>
      <rect x="160" y="140" width="16" height="16"/><rect x="104" y="160" width="16" height="16"/><rect x="140" y="164" width="16" height="16"/>
